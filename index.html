    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : structuredClone(fallback);
      } catch (err) {
        console.error('Gagal memuat data dari localStorage:', err);
        return structuredClone(fallback);
      }
    }

    function saveJSON(key, value) {

        console.error('Gagal menyimpan data ke localStorage:', err);
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const styles = {
        info: 'bg-blue-600 text-white border-blue-700',
        success: 'bg-emerald-600 text-white border-emerald-700',
        warning: 'bg-amber-500 text-white border-amber-600',
        danger: 'bg-rose-600 text-white border-rose-700'
      };

      const icons = {
        info: 'info',
        success: 'check-circle-2',
        warning: 'alert-triangle',
        danger: 'alert-octagon'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium animate-fade-in ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1">${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons({ nodes: [toast] });

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 3600);
    }

    function openConfirmModal({ title, message, confirmText = 'Ya, Lanjutkan', cancelText = 'Batal', danger = false }) {
      return new Promise((resolve) => {
        const backdrop = document.getElementById('modalBackdrop');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');
        const iconWrap = document.getElementById('modalIconWrap');

        titleEl.textContent = title;
        msgEl.textContent = message;
        confirmBtn.textContent = confirmText;
        cancelBtn.textContent = cancelText;

        if (danger) {
          confirmBtn.className = 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition-colors shadow-sm';
          iconWrap.className = 'w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0';
        } else {
          confirmBtn.className = 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm';
          iconWrap.className = 'w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center shrink-0';
        }

        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
        lucide.createIcons({ nodes: [backdrop] });

        const cleanup = (result) => {
          backdrop.classList.add('hidden');
          backdrop.classList.remove('flex');
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
          backdrop.removeEventListener('click', onBackdrop);
          resolve(result);
        };

        const onConfirm = () => cleanup(true);
        const onCancel = () => cleanup(false);
        const onBackdrop = (e) => {
          if (e.target === backdrop) cleanup(false);
        };

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        backdrop.addEventListener('click', onBackdrop);
      });
    }

    function formatSeconds(sec) {
      const safe = Math.max(0, Math.floor(sec));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatDurationHuman(sec) {
      const safe = Math.max(0, Math.floor(sec));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      if (mins === 0) return `${secs} detik`;
      return `${mins} menit ${secs} detik`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    async function navigateTo(targetView) {
      if (state.currentView === targetView && targetView !== 'exam') return;

      // Guard if leaving an active exam
      if (state.exam.active && targetView !== 'exam') {
        const confirmed = await openConfirmModal({
          title: 'Ujian Sedang Berlangsung',
          message: 'Anda sedang mengerjakan ujian. Jika berpindah halaman sekarang, sesi ujian aktif akan dibatalkan dan tidak tersimpan ke riwayat. Yakin ingin keluar?',
          confirmText: 'Keluar dari Ujian',
          cancelText: 'Lanjutkan Ujian',
          danger: true
        });
        if (!confirmed) return;
        stopExamTimer();
        state.exam.active = false;
        updateHeaderTimerBadge();
      }

      state.currentView = targetView;
      updateNavActiveStyles();
      renderApp();
    }

    function updateNavActiveStyles() {
      document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach((btn) => {
        const isCurrent = btn.dataset.nav === state.currentView;
        if (isCurrent) {
          btn.className = btn.className.replace(/text-slate-600|hover:bg-slate-100/g, '');
          btn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
        } else {
          btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
          if (!btn.className.includes('text-slate-600')) {
            btn.classList.add('text-slate-600', 'hover:bg-slate-100');
          }
        }
      });
    }

    // =========================================================================
    // 5. TIMER ENGINE (CONTINUOUS ACROSS NAVIGATION)
    // =========================================================================
    function startExamTimer() {
      stopExamTimer();
      updateHeaderTimerBadge();

      state.exam.timerInterval = setInterval(() => {
        if (!state.exam.active) {
          stopExamTimer();
          return;
        }

        state.exam.remainingSeconds -= 1;
        updateTimerDisplays();

        // 5-minute warning (300 seconds)
        if (state.exam.remainingSeconds === 300 && !state.exam.warningShown) {
          state.exam.warningShown = true;
          showToast('Peringatan: Sisa waktu ujian tinggal 5 menit!', 'warning');
          const banner = document.getElementById('fiveMinWarningBanner');
          if (banner) banner.classList.remove('hidden');
        }

        // Auto-submit when time reaches 0
        if (state.exam.remainingSeconds <= 0) {
          state.exam.remainingSeconds = 0;
          updateTimerDisplays();
          stopExamTimer();
          showToast('Waktu ujian telah habis! Jawaban otomatis dikoreksi.', 'danger');
          finalizeExam(true);
        }
      }, 1000);
    }

    function stopExamTimer() {
      if (state.exam.timerInterval) {
        clearInterval(state.exam.timerInterval);
        state.exam.timerInterval = null;
      }

    function updateHeaderTimerBadge() {
      const badge = document.getElementById('headerTimerBadge');

    // =========================================================================
    // 6. ANSWER EVALUATION & GRADING LOGIC
    // =========================================================================
    function hasAnsweredQuestion(q, answerVal) {
      if (answerVal === undefined || answerVal === null) return false;
      if (q.type === 'PG' || q.type === 'BS') {
        return typeof answerVal === 'string' && answerVal.trim().length > 0;
      }
      if (q.type === 'PGK') {
        return Array.isArray(answerVal) && answerVal.length > 0;
      }
      if (q.type === 'ISIAN') {
        return typeof answerVal === 'string' && answerVal.trim().length > 0;
      }
      if (q.type === 'JODOH') {
        if (typeof answerVal !== 'object') return false;
        const items = q.matchItems || [];
        return items.length > 0 && items.every((it) => Boolean(answerVal[it.id]));
      }
      if (q.type === 'URAIAN') {
        return typeof answerVal === 'string' && answerVal.trim().length > 0;
      }
      return false;
    }

    function evaluateQuestion(q, answerVal, rubricSelfCheck = true) {
      if (!hasAnsweredQuestion(q, answerVal)) {
        return {
          isCorrect: false,
          answered: false,
          statusText: 'Belum Dijawab',
          rubricMet: false
        };
      }

      if (q.type === 'PG' || q.type === 'BS') {
        const isCorrect = String(answerVal) === String(q.correctAnswer);
        return {
          isCorrect,
          answered: true,
          statusText: isCorrect ? 'Jawaban Benar' : 'Jawaban Kurang Tepat / Salah',
          rubricMet: isCorrect
        };
      }

      if (q.type === 'PGK') {
        const expected = Array.isArray(q.correctAnswer) ? [...q.correctAnswer].sort() : [];
        const actual = Array.isArray(answerVal) ? [...answerVal].sort() : [];
        const isCorrect =
          expected.length === actual.length &&
          expected.every((val, idx) => val === actual[idx]);
        return {
          isCorrect,
          answered: true,
          statusText: isCorrect
            ? 'Jawaban Benar (2 Pilihan Tepat)'
            : 'Jawaban Belum Tepat (Pilih tepat 2 opsi sesuai kunci)',
          rubricMet: isCorrect
        };
      }

      if (q.type === 'ISIAN') {
        const normalized = String(answerVal).toLowerCase().trim();
        const keywords = Array.isArray(q.acceptedKeywords) && q.acceptedKeywords.length > 0
          ? q.acceptedKeywords.map((k) => String(k).toLowerCase().trim())
          : [String(q.correctAnswer || '').toLowerCase().trim()];

        const isCorrect = keywords.some((kw) => kw && (normalized === kw || normalized.includes(kw)));
        return {
          isCorrect,
          answered: true,
          statusText: isCorrect ? 'Jawaban Benar' : 'Jawaban Kurang Sesuai Kunci',
          rubricMet: isCorrect
        };
      }

      if (q.type === 'JODOH') {
        const expectedMap = q.correctAnswer || {};
        const items = q.matchItems || [];
        const isCorrect =
          items.length > 0 &&
          items.every((it) => String(answerVal[it.id] || '') === String(expectedMap[it.id] || ''));
        return {
          isCorrect,
          answered: true,
          statusText: isCorrect ? 'Pasangan Tepat (Benar)' : 'Pasangan Belum Tepat',
          rubricMet: isCorrect
        };
      }

      if (q.type === 'URAIAN') {
        const isCorrect = Boolean(rubricSelfCheck);
        return {
          isCorrect,
          answered: true,
          statusText: isCorrect
            ? 'Dinilai Benar (Memenuhi Poin Pembahasan)'
            : 'Perlu Penyempurnaan (Belum Memenuhi Poin Kunci)',
          rubricMet: isCorrect
        };
      }

      return { isCorrect: false, answered: true, statusText: 'Tercatat', rubricMet: false };
    }

    function startNewExamSession(customMinutes = null) {
      const bank = state.questions;
      if (!bank || bank.length === 0) {
        showToast('Tidak ada soal tersedia. Tambahkan soal di panel Admin.', 'danger');
        return;
      }

      const minutes = Number(customMinutes) > 0 ? Number(customMinutes) : Number(state.config.durationMinutes) || 120;
      const totalSec = minutes * 60;

      // Shuffle questions and shuffle choices for PG / PGK / JODOH
      const shuffledQuestions = shuffleArray(bank).map((q) => {
        const clone = structuredClone(q);
        if ((clone.type === 'PG' || clone.type === 'PGK' || clone.type === 'JODOH') && Array.isArray(clone.options)) {
          clone.shuffledOptions = shuffleArray(clone.options);
        }
        return clone;
      });

      state.exam = {
        active: true,
        sessionQuestions: shuffledQuestions,
        currentIndex: 0,
        answers: {},
        submitted: {},
        evaluations: {},
        remainingSeconds: totalSec,
        totalSeconds: totalSec,
        warningShown: false,
        timerInterval: null,
        startedAt: new Date().toISOString()
      };

      state.currentView = 'exam';
      updateNavActiveStyles();
      renderApp();
      startExamTimer();
      showToast(`Ujian dimulai (${minutes} menit). Urutan soal & opsi telah diacak.`, 'success');
    }

    function submitCurrentQuestion() {
      const q = state.exam.sessionQuestions[state.exam.currentIndex];
      if (!q) return;

      const ans = state.exam.answers[q.id];
      if (!hasAnsweredQuestion(q, ans)) {
        showToast('Silakan pilih atau isi jawaban terlebih dahulu sebelum menekan "Jawab".', 'warning');
        return;
      }

      if (q.type === 'PGK') {
        const required = q.selectCount || 2;
        if (!Array.isArray(ans) || ans.length !== required) {
          showToast(`Soal Pilihan Ganda Kompleks ini mewajibkan memilih tepat ${required} jawaban.`, 'warning');
          return;
        }
      }

      const rubricCheckbox = document.getElementById(`rubricMet_${q.id}`);
      const rubricMet = rubricCheckbox ? rubricCheckbox.checked : true;

      const evalResult = evaluateQuestion(q, ans, rubricMet);
      state.exam.submitted[q.id] = true;
      state.exam.evaluations[q.id] = evalResult;

      renderApp();
      showToast(evalResult.statusText, evalResult.isCorrect ? 'success' : 'warning');
    }

    async function confirmFinishExam() {
      const total = state.exam.sessionQuestions.length;
      const answeredCount = state.exam.sessionQuestions.filter((q) => hasAnsweredQuestion(q, state.exam.answers[q.id])).length;
      const unansweredCount = total - answeredCount;

      const msg =
        unansweredCount > 0
          ? `Masih ada ${unansweredCount} dari ${total} soal yang belum dijawab. Apakah Anda yakin ingin menyelesaikan ujian dan melihat hasil nilai?`
          : `Seluruh ${total} soal telah diisi. Apakah Anda yakin ingin mengakhiri ujian dan melihat hasil nilai?`;

      const ok = await openConfirmModal({
        title: 'Selesaikan Ujian?',
        message: msg,
        confirmText: 'Selesai & Lihat Hasil',
        cancelText: 'Kembali Mengerjakan',
        danger: false
      });

      if (ok) {
        finalizeExam(false);
      }
    }

    function finalizeExam(autoByTimeout = false) {
      stopExamTimer();
      const sessionQs = state.exam.sessionQuestions;
      const totalQuestions = sessionQs.length;

      let correctCount = 0;
      let wrongCount = 0;
      let unansweredCount = 0;

      const detailItems = sessionQs.map((q, idx) => {
        const ans = state.exam.answers[q.id];
        const isAnswered = hasAnsweredQuestion(q, ans);

        let ev = state.exam.evaluations[q.id];
        if (!ev) {
          const rubricCheckbox = document.getElementById(`rubricMet_${q.id}`);
          const rubricMet = rubricCheckbox ? rubricCheckbox.checked : false;
          ev = evaluateQuestion(q, ans, rubricMet);
        }

        if (!isAnswered) {
          unansweredCount += 1;
        } else if (ev.isCorrect) {
          correctCount += 1;
        } else {
          wrongCount += 1;
        }

        return {
          order: idx + 1,
          question: q,
          userAnswer: ans,
          isAnswered,
          isCorrect: isAnswered && ev.isCorrect,
          statusText: !isAnswered ? 'Belum Dijawab' : ev.statusText
        };
      });

      // Rumus resmi: Nilai = (Jumlah jawaban benar / Total soal) × 100
      const rawScore = totalQuestions > 0 ? (correctCount / totalQuestions) * 100 : 0;
      const finalScore = Number(rawScore.toFixed(2));
      const successRate = totalQuestions > 0 ? Number(((correctCount / totalQuestions) * 100).toFixed(1)) : 0;
      const timeUsedSeconds = Math.max(1, state.exam.totalSeconds - state.exam.remainingSeconds);
      const passed = finalScore >= (Number(state.config.passingGrade) || 75);

      const attemptRecord = {
        id: 'att_' + Date.now(),
        date: new Date().toISOString(),
        examTitle: state.config.title,
        score: finalScore,
        correctCount,
        wrongCount,
        unansweredCount,
        totalQuestions,
        successRate,
        timeUsedSeconds,
        passed,
        passingGrade: Number(state.config.passingGrade) || 75,
        autoByTimeout
      };

      state.history.unshift(attemptRecord);
      saveJSON(STORAGE_KEYS.HISTORY, state.history);

      state.latestResult = {
        ...attemptRecord,
        details: detailItems
      };

      state.exam.active = false;
      updateHeaderTimerBadge();

      state.currentView = 'results';
      updateNavActiveStyles();
      renderApp();
    }

    function getStatsFromHistory() {
      if (!state.history || state.history.length === 0) {
        return { count: 0, best: 0, average: 0 };
      }
      const scores = state.history.map((h) => Number(h.score) || 0);
      const best = Math.max(...scores);
      const sum = scores.reduce((acc, v) => acc + v, 0);
      const average = Number((sum / scores.length).toFixed(2));
      return {
        count: scores.length,
        best: Number(best.toFixed(2)),
        average
      };
    }

    // =========================================================================
    // 7. RENDERERS FOR EACH VIEW
    // =========================================================================

      const container = document.getElementById('appContainer');
      if (!container) return;

      if (state.currentView === 'home') {
        container.innerHTML = renderHomeView();
        bindHomeEvents();
      } else if (state.currentView === 'exam') {
        container.innerHTML = renderExamView();
        bindExamEvents();
        updateTimerDisplays();
      } else if (state.currentView === 'results') {
        container.innerHTML = renderResultsView();
        bindResultsEvents();
        renderResultsChart();
      } else if (state.currentView === 'history') {
        container.innerHTML = renderHistoryView();
        bindHistoryEvents();
        renderHistoryChart();
      } else if (state.currentView === 'admin') {
        container.innerHTML = renderAdminView();
        bindAdminEvents();
      }

      lucide.createIcons();
    }

              <!-- Submit Answer ("Jawab") & Step Navigation -->

                    }

                    return `
                      <button data-jump-index="${qIdx}" class="jump-q-btn h-10 rounded-xl border text-xs transition-all flex items-center justify-center cursor-pointer ${btnClass}" type="button">
                        ${qIdx + 1}
                      </button>
                    `;
                  })
                  .join('')}
              </div>

              <!-- Legend -->
              <div class="pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-600">
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded bg-blue-100 border border-blue-300 inline-block"></span>
                  <span>Sudah Dijawab</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded bg-slate-100 border border-slate-200 inline-block"></span>
                  <span>Belum Dijawab</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded bg-emerald-100 border border-emerald-400 inline-block"></span>
                  <span>Terkoreksi Benar</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded bg-rose-100 border border-rose-400 inline-block"></span>
                  <span>Terkoreksi Kurang Tepat</span>
                </div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderQuestionInputBody(q, userAns, isSubmitted, evaluation) {
      const displayOpts = q.shuffledOptions || q.options || [];

      if (q.type === 'PG') {
        return displayOpts
          .map((opt) => {
            const selected = userAns === opt.key;
            let cardStyle = 'border-slate-200 hover:border-blue-300 hover:bg-blue-50/40 bg-white';
            if (isSubmitted) {
              if (opt.key === q.correctAnswer) {
                cardStyle = 'border-emerald-500 bg-emerald-50/90 text-emerald-950';
              } else if (selected && opt.key !== q.correctAnswer) {
                cardStyle = 'border-rose-500 bg-rose-50/90 text-rose-950';
              } else {
                cardStyle = 'border-slate-200 bg-slate-50/60 opacity-75';
              }
            } else if (selected) {
              cardStyle = 'border-blue-600 bg-blue-50/90 ring-1 ring-blue-600';
            }

            return `
              <button data-pg-key="${opt.key}" ${isSubmitted ? 'disabled' : ''} class="pg-option-btn w-full text-left p-4 rounded-xl border transition-all flex items-start gap-3.5 ${cardStyle} ${isSubmitted ? '' : 'cursor-pointer'}" type="button">
                <span class="w-7 h-7 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 ${
                  selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'
                }">${opt.key}</span>
                <span class="text-sm leading-relaxed flex-1">${opt.text}</span>
              </button>
            `;
          })
          .join('');
      }

      if (q.type === 'PGK') {
        const selectedArr = Array.isArray(userAns) ? userAns : [];
        const reqCount = q.selectCount || 2;
        const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];

        return `
          <div class="flex items-center justify-between text-xs font-semibold px-3.5 py-2 rounded-xl bg-violet-50 text-violet-800 border border-violet-200">
            <span>Pilih tepat ${reqCount} jawaban</span>
            <span>Terpilih: ${selectedArr.length} / ${reqCount}</span>
          </div>
          ${displayOpts
            .map((opt) => {
              const checked = selectedArr.includes(opt.key);
              const isRightOpt = correctArr.includes(opt.key);

              let cardStyle = 'border-slate-200 hover:border-violet-300 hover:bg-violet-50/40 bg-white';
              if (isSubmitted) {
                if (isRightOpt) {
                  cardStyle = 'border-emerald-500 bg-emerald-50/90 text-emerald-950';
                } else if (checked && !isRightOpt) {
                  cardStyle = 'border-rose-500 bg-rose-50/90 text-rose-950';
                } else {
                  cardStyle = 'border-slate-200 bg-slate-50/60 opacity-75';
                }
              } else if (checked) {
                cardStyle = 'border-violet-600 bg-violet-50/90 ring-1 ring-violet-600';
              }

              return `
                <button data-pgk-key="${opt.key}" ${isSubmitted ? 'disabled' : ''} class="pgk-option-btn w-full text-left p-4 rounded-xl border transition-all flex items-start gap-3.5 ${cardStyle} ${isSubmitted ? '' : 'cursor-pointer'}" type="button">
                  <span class="w-6 h-6 rounded-md border flex items-center justify-center shrink-0 mt-0.5 ${
                    checked ? 'bg-violet-600 border-violet-600 text-white' : 'border-slate-300 bg-white text-transparent'
                  }">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  </span>
                  <span class="font-bold text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-700 mt-0.5">${opt.key}</span>
                  <span class="text-sm leading-relaxed flex-1">${opt.text}</span>
                </button>
              `;
            })
            .join('')}
        `;
      }

      if (q.type === 'BS') {
        return `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            ${['BENAR', 'SALAH']
              .map((val) => {
                const selected = userAns === val;
                let style = 'border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50/50 text-slate-800';
                if (isSubmitted) {
                  if (q.correctAnswer === val) {
                    style = 'border-emerald-500 bg-emerald-50 text-emerald-900 ring-1 ring-emerald-500';
                  } else if (selected && q.correctAnswer !== val) {
                    style = 'border-rose-500 bg-rose-50 text-rose-900 ring-1 ring-rose-500';
                  } else {
                    style = 'border-slate-200 bg-slate-50 opacity-70 text-slate-600';
                  }
                } else if (selected) {
                  style = 'border-blue-600 bg-blue-50 text-blue-900 ring-2 ring-blue-600';
                }

                return `
                  <button data-bs-val="${val}" ${isSubmitted ? 'disabled' : ''} class="bs-option-btn p-4 rounded-2xl border font-display font-bold text-base transition-all flex items-center justify-center gap-2.5 ${style} ${isSubmitted ? '' : 'cursor-pointer'}" type="button">
                    <i data-lucide="${val === 'BENAR' ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
                    <span>${val}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        `;
      }

      if (q.type === 'JODOH') {
        const currentMap = typeof userAns === 'object' && userAns !== null ? userAns : {};
        const items = q.matchItems || [];
        const matchChoices = q.options || [];

        return `
          <div class="space-y-4">
            ${items
              .map((it) => {
                const chosenKey = currentMap[it.id] || '';
                const expectedKey = q.correctAnswer ? q.correctAnswer[it.id] : '';
                let rowBorder = 'border-slate-200 bg-slate-50/60';
                if (isSubmitted) {
                  rowBorder = chosenKey === expectedKey ? 'border-emerald-400 bg-emerald-50/70' : 'border-rose-400 bg-rose-50/70';
                }

                return `
                  <div class="p-4 rounded-xl border ${rowBorder} space-y-2.5">
                    <div class="font-semibold text-sm text-slate-900">${it.label}</div>
                    <label class="block text-xs font-medium text-slate-500">Pilih pasangan yang paling sesuai (A–H):</label>
                    <select data-match-item="${it.id}" ${isSubmitted ? 'disabled' : ''} class="match-select w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-800 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 focus:outline-none">
                      <option value="">-- Pilih Pasangan Jawaban --</option>
                      ${matchChoices
                        .map(
                          (opt) => `
                        <option value="${opt.key}" ${chosenKey === opt.key ? 'selected' : ''}>
                          ${opt.key}. ${opt.text}
                        </option>
                      `
                        )
                        .join('')}
                    </select>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      }

      if (q.type === 'ISIAN') {
        return `
          <div class="space-y-2">
            <label for="isianInput" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">
              Jawaban Singkat Anda
            </label>
            <input
              id="isianInput"
              type="text"
              ${isSubmitted ? 'disabled' : ''}
              value="${userAns ? String(userAns).replace(/"/g, '&quot;') : ''}"
              placeholder="Ketik kata atau frasa jawaban singkat di sini..."
              class="w-full rounded-xl border ${
                isSubmitted
                  ? evaluation?.isCorrect
                    ? 'border-emerald-500 bg-emerald-50/60 text-emerald-950'
                    : 'border-rose-500 bg-rose-50/60 text-rose-950'
                  : 'border-slate-300 bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20'
              } px-4 py-3 text-sm font-medium focus:outline-none transition-all"
            />
          </div>
        `;
      }

      if (q.type === 'URAIAN') {
        const rubricMet = evaluation ? evaluation.rubricMet : true;
        return `
          <div class="space-y-3">
            <label for="uraianTextarea" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">
              Uraian Analisis Jawaban Anda
            </label>
            <textarea
              id="uraianTextarea"
              rows="5"
              ${isSubmitted ? 'disabled' : ''}
              placeholder="Tuliskan analisis, konsep, perbedaan/persamaan, atau contoh secara jelas dan terstruktur..."
              class="w-full rounded-xl border border-slate-300 bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 p-4 text-sm leading-relaxed focus:outline-none transition-all"
            >${userAns ? String(userAns) : ''}</textarea>

            <div class="p-3.5 rounded-xl bg-violet-50/80 border border-violet-200/80 flex items-start gap-3">
              <input
                id="rubricMet_${q.id}"
                type="checkbox"
                ${isSubmitted ? 'disabled' : ''}
                ${rubricMet ? 'checked' : ''}
                class="mt-1 w-4 h-4 rounded text-violet-600 focus:ring-violet-500 cursor-pointer"
              />
              <label for="rubricMet_${q.id}" class="text-xs text-violet-950 leading-relaxed cursor-pointer">
                <span class="font-bold">Evaluasi Mandiri Rubrik Uraian:</span> Centang jika jawaban Anda mencakup inti poin pembahasan & contoh sesuai kunci jawaban (dapat disesuaikan saat menekan "Jawab").
              </label>
            </div>
          </div>
        `;
      }

      return '';
    }

    function renderExplanationPanel(q, evaluation) {
      const isRight = Boolean(evaluation && evaluation.isCorrect);
      const boxColor = isRight
        ? 'bg-emerald-50/90 border-emerald-300 text-emerald-950'
        : 'bg-rose-50/90 border-rose-300 text-rose-950';

      const badgeColor = isRight
        ? 'bg-emerald-600 text-white'
        : 'bg-rose-600 text-white';

      let formattedKey = '';
      if (q.type === 'PG' || q.type === 'BS') {
        formattedKey = String(q.correctAnswer);
      } else if (q.type === 'PGK') {
        formattedKey = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(' & ') : String(q.correctAnswer);
      } else if (q.type === 'JODOH') {
        const entries = Object.entries(q.correctAnswer || {});
        formattedKey = entries.map(([k, v]) => `${k.replace('item_', 'Soal ')} → ${v}`).join(', ');
      } else {
        formattedKey = String(q.correctAnswer || '');
      }

      return `
        <div class="rounded-2xl border p-5 space-y-3 animate-fade-in ${boxColor}">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${badgeColor}">
              <i data-lucide="${isRight ? 'check-circle-2' : 'alert-circle'}" class="w-3.5 h-3.5"></i>
              <span>${evaluation ? evaluation.statusText : 'Pembahasan'}</span>
            </span>
            <span class="text-xs font-bold">Kunci Jawaban: ${formattedKey}</span>
          </div>

          <div class="space-y-1">
            <div class="text-xs font-bold uppercase tracking-wider opacity-75">Pembahasan Lengkap</div>
            <p class="text-sm leading-relaxed">${q.explanation}</p>
          </div>

          ${
            Array.isArray(q.rubricPoints) && q.rubricPoints.length > 0
              ? `
            <div class="pt-2 border-t border-black/10 space-y-1">
              <div class="text-xs font-bold uppercase tracking-wider opacity-75">Poin Penilaian Rubrik</div>
              <ul class="list-disc list-inside text-xs space-y-1">
                ${q.rubricPoints.map((pt) => `<li>${pt}</li>`).join('')}
              </ul>
            </div>
          `
              : ''
          }
        </div>
      `;
    }

    function bindExamEvents() {
      const emptyStart = document.getElementById('emptyExamStartBtn');
      if (emptyStart) {
        emptyStart.addEventListener('click', () => startNewExamSession());
        return;
      }

      const q = state.exam.sessionQuestions[state.exam.currentIndex];
      if (!q) return;

      // PG selection
      document.querySelectorAll('.pg-option-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.exam.submitted[q.id]) return;
          state.exam.answers[q.id] = btn.dataset.pgKey;
          renderApp();
        });
      });

      // PGK selection (toggle up to selectCount)
      document.querySelectorAll('.pgk-option-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.exam.submitted[q.id]) return;
          const key = btn.dataset.pgkKey;
          const maxSelect = q.selectCount || 2;
          let current = Array.isArray(state.exam.answers[q.id]) ? [...state.exam.answers[q.id]] : [];

          if (current.includes(key)) {
            current = current.filter((item) => item !== key);
          } else {
            if (current.length >= maxSelect) {
              showToast(`Maksimal ${maxSelect} pilihan untuk soal ini. Lepaskan salah satu pilihan terlebih dahulu.`, 'warning');
              return;
            }
            current.push(key);
          }

          state.exam.answers[q.id] = current;
          renderApp();
        });
      });

      // Benar / Salah selection
      document.querySelectorAll('.bs-option-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.exam.submitted[q.id]) return;
          state.exam.answers[q.id] = btn.dataset.bsVal;
          renderApp();
        });
      });

      // Menjodohkan selects
      document.querySelectorAll('.match-select').forEach((sel) => {
        sel.addEventListener('change', () => {
          if (state.exam.submitted[q.id]) return;
          const itemId = sel.dataset.matchItem;
          const prevObj = typeof state.exam.answers[q.id] === 'object' && state.exam.answers[q.id] !== null
            ? { ...state.exam.answers[q.id] }
            : {};
          prevObj[itemId] = sel.value;
          state.exam.answers[q.id] = prevObj;
        });
      });

      // Isian Singkat input
      const isianEl = document.getElementById('isianInput');
      if (isianEl) {
        isianEl.addEventListener('input', (e) => {
          state.exam.answers[q.id] = e.target.value;
        });
      }

      // Uraian textarea
      const uraianEl = document.getElementById('uraianTextarea');
      if (uraianEl) {
        uraianEl.addEventListener('input', (e) => {
          state.exam.answers[q.id] = e.target.value;
        });
      }

      // Prev / Next buttons
      const prevBtn = document.getElementById('prevQuestionBtn');
      const nextBtn = document.getElementById('nextQuestionBtn');
      const nextAfterSubmitBtn = document.getElementById('nextAfterSubmitBtn');

      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (state.exam.currentIndex > 0) {
            state.exam.currentIndex -= 1;
            renderApp();
          }
        });
      }

      const goNext = () => {
        if (state.exam.currentIndex < state.exam.sessionQuestions.length - 1) {
          state.exam.currentIndex += 1;
          renderApp();
        }
      };

      if (nextBtn) nextBtn.addEventListener('click', goNext);
      if (nextAfterSubmitBtn) nextAfterSubmitBtn.addEventListener('click', goNext);

      // Submit Answer ("Jawab")
      const submitBtn = document.getElementById('submitAnswerBtn');
      if (submitBtn) {
        submitBtn.addEventListener('click', submitCurrentQuestion);
      }

      // Finish exam triggers
      const finishTop = document.getElementById('finishExamTopBtn');
      const finishLast = document.getElementById('finishFromLastBtn');
      if (finishTop) finishTop.addEventListener('click', confirmFinishExam);
      if (finishLast) finishLast.addEventListener('click', confirmFinishExam);

      // Navigator jump buttons
      document.querySelectorAll('.jump-q-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetIdx = Number(btn.dataset.jumpIndex);
          if (!Number.isNaN(targetIdx)) {
            state.exam.currentIndex = targetIdx;
            renderApp();
          }
        });
      });
    }

                      <div class="p-4 rounded-xl border border-slate-200/80 bg-slate-50/50 space-y-2">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                          <span class="text-xs font-bold text-slate-700">

                          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${badge}">
                            ${item.statusText}
                          </span>
                        </div>

                        <p class="text-xs text-slate-600 leading-relaxed">
                          <strong class="text-slate-800">Pembahasan:</strong> ${item.question.explanation}
                        </p>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderResultsChart() {
      const canvas = document.getElementById('resultsBreakdownChart');
      const res = state.latestResult;
      if (!canvas || !res || typeof Chart === 'undefined') return;

      if (breakdownChartInstance) {
        breakdownChartInstance.destroy();
      }

      breakdownChartInstance = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: ['Jawaban Benar', 'Jawaban Salah', 'Belum Dijawab'],
          datasets: [
            {
              data: [res.correctCount, res.wrongCount, res.unansweredCount],
              backgroundColor: ['#10b981', '#f43f5e', '#94a3b8'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { family: 'Inter', size: 12 }
              }
            }
          }
        }
      });
    }

    function bindResultsEvents() {
      const goHome = document.getElementById('goHomeFromEmptyResBtn');
      if (goHome) goHome.addEventListener('click', () => navigateTo('home'));

      const retryBtn = document.getElementById('retryExamBtn');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => startNewExamSession(state.config.durationMinutes));
      }

      const histBtn = document.getElementById('viewHistoryFromResBtn');
      if (histBtn) {
        histBtn.addEventListener('click', () => navigateTo('history'));
      }

      const homeBtn = document.getElementById('backHomeFromResBtn');
      if (homeBtn) {
        homeBtn.addEventListener('click', () => navigateTo('home'));
      }
    }

    // --- 7D. HISTORY DASHBOARD VIEW ---
    function renderHistoryView() {
      const stats = getStatsFromHistory();
      const items = state.history || [];

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="font-display font-bold text-2xl text-slate-900">Dashboard Riwayat Ujian</h1>
              <p class="text-sm text-slate-500">Pantau perkembangan nilai, waktu pengerjaan, dan status kelulusan tiap percobaan</p>
            </div>
            <div class="flex items-center gap-2.5">
              <button id="historyStartExamBtn" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm flex items-center gap-2 cursor-pointer" type="button">
                <i data-lucide="play" class="w-4 h-4"></i>
                <span>Mulai Percobaan Baru</span>
              </button>
              ${
                items.length > 0
                  ? `
                <button id="clearHistoryBtn" class="px-4 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-semibold text-sm flex items-center gap-2 cursor-pointer" type="button">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                  <span>Hapus Riwayat</span>
                </button>

                  : ''

          </div>

          <!-- Top Summary Cards -->

            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
              <div class="text-xs font-semibold text-slate-500 uppercase">Total Percobaan</div>
              <div class="font-display font-bold text-3xl text-slate-900 mt-1">${stats.count}x</div>
            </div>
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
              <div class="text-xs font-semibold text-blue-600 uppercase">Nilai Tertinggi</div>
              <div class="font-display font-bold text-3xl text-blue-700 mt-1">${stats.count > 0 ? stats.best : '—'}</div>
            </div>
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
              <div class="text-xs font-semibold text-violet-600 uppercase">Rata-Rata Nilai</div>
              <div class="font-display font-bold text-3xl text-violet-700 mt-1">${stats.count > 0 ? stats.average : '—'}</div>
            </div>
          </div>

          <!-- Score Progression Chart -->
          <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-xs space-y-4">

            ${
              items.length > 0
                ? `<div class="h-72"><canvas id="historyProgressionChart"></canvas></div>`
                : `<div class="py-12 text-center text-sm text-slate-500">Belum ada data percobaan ujian untuk ditampilkan pada grafik.</div>`
            }
          </div>

          <!-- Attempts Table -->
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="p-5 border-b border-slate-100">
              <h2 class="font-display font-bold text-lg text-slate-900">Daftar Percobaan Ujian</h2>
            </div>

            ${
              items.length === 0
                ? `
              <div class="p-10 text-center text-sm text-slate-500">
                Belum ada riwayat ujian tersimpan. Klik <strong>Mulai Percobaan Baru</strong> untuk mengerjakan ujian.
              </div>
            `
                : `
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="bg-slate-50 text-slate-600 text-xs uppercase border-b border-slate-200">
                      <th class="py-3.5 px-4">Percobaan</th>
                      <th class="py-3.5 px-4">Tanggal & Waktu</th>
                      <th class="py-3.5 px-4">Benar / Total</th>
                      <th class="py-3.5 px-4">Waktu Digunakan</th>
                      <th class="py-3.5 px-4">Nilai</th>
                      <th class="py-3.5 px-4">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${items
                      .map((att, idx) => {
                        const attemptNum = items.length - idx;
                        const dt = new Date(att.date).toLocaleString('id-ID', {
                          dateStyle: 'medium',
                          timeStyle: 'short'
                        });
                        return `
                          <tr class="hover:bg-slate-50/80 transition-colors">

                            <td class="py-3.5 px-4 font-display font-bold text-base text-blue-700">${att.score}</td>
                            <td class="py-3.5 px-4">
                              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                                att.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'

                                ${att.passed ? 'Lulus' : 'Tidak Lulus'}

                            </td>
                          </tr>
                        `;
                      })
                      .join('')}
                  </tbody>
                </table>
              </div>
            `
            }
          </div>
        </div>
      `;
    }

    function renderHistoryChart() {
      const canvas = document.getElementById('historyProgressionChart');
      if (!canvas || !state.history || state.history.length === 0 || typeof Chart === 'undefined') return;

      if (historyChartInstance) {
        historyChartInstance.destroy();
      }

      const chronological = [...state.history].reverse();
      const labels = chronological.map((_, i) => `Percobaan #${i + 1}`);
      const scores = chronological.map((a) => Number(a.score));

      historyChartInstance = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Nilai Ujian (0–100)',
              data: scores,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.12)',
              pointBackgroundColor: '#7c3aed',
              pointBorderColor: '#ffffff',
              pointRadius: 5,
              borderWidth: 3,
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 0,
              max: 100,
              ticks: { stepSize: 20 }
            }
          },
          plugins: {
            legend: {
              labels: { font: { family: 'Inter', size: 12 } }
            }
          }
        }
      });
    }

    function bindHistoryEvents() {
      const startBtn = document.getElementById('historyStartExamBtn');
      if (startBtn) startBtn.addEventListener('click', () => startNewExamSession());

      const clearBtn = document.getElementById('clearHistoryBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', async () => {
          const ok = await openConfirmModal({
            title: 'Hapus Semua Riwayat Ujian?',
            message: 'Seluruh catatan percobaan ujian dan grafik perkembangan nilai akan dihapus permanen.',
            confirmText: 'Ya, Hapus Riwayat',
            cancelText: 'Batal',
            danger: true
          });
          if (ok) {
            state.history = [];
            saveJSON(STORAGE_KEYS.HISTORY, []);
            renderApp();
            showToast('Riwayat ujian berhasil dihapus.', 'info');
          }
        });
      }
    }

    // --- 7E. ADMIN PANEL VIEW ---

      const cfg = state.config;

        ? state.questions.find((item) => item.id === state.admin.editingId)

          !query ||
          q.prompt.toLowerCase().includes(query) ||
          q.topic.toLowerCase().includes(query) ||

                    <label class="block text-xs font-semibold text-slate-600 mb-1">Durasi Ujian (Menit)</label>

                  <span>Simpan Pengaturan Ujian</span>

              </div>

                    <option value="ISIAN" ${formType === 'ISIAN' ? 'selected' : ''}>Isian Singkat (ISIAN)</option>
                    <option value="URAIAN" ${formType === 'URAIAN' ? 'selected' : ''}>Uraian Panjang (URAIAN)</option>

                    ${cfg.categories
                      .map(
                        (cat) => `
                      <option value="${cat}" ${(editingQ?.category || cfg.categories[0]) === cat ? 'selected' : ''}>${cat}</option>

                      .join('')}

                <label class="block text-xs font-semibold text-slate-600 mb-1">Pertanyaan / Narasi Soal</label>

              <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm flex items-center gap-2 cursor-pointer">

                <span>${editingQ ? 'Perbarui Soal' : 'Simpan Soal Baru'}</span>

              <div>
                <h2 class="font-display font-bold text-lg text-slate-900">Bank Soal (${filteredQs.length} / ${state.questions.length} Soal)</h2>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select id="adminFilterType" class="rounded-xl border border-slate-300 px-3 py-2 text-xs font-semibold bg-white">

                  <option value="PGK" ${state.admin.filterType === 'PGK' ? 'selected' : ''}>PGK</option>
                  <option value="BS" ${state.admin.filterType === 'BS' ? 'selected' : ''}>Benar–Salah</option>
                  <option value="JODOH" ${state.admin.filterType === 'JODOH' ? 'selected' : ''}>Menjodohkan</option>
                  <option value="ISIAN" ${state.admin.filterType === 'ISIAN' ? 'selected' : ''}>Isian Singkat</option>

          </section>
        </div>

    function renderAdminDynamicFields(type, editingQ) {
      if (type === 'PG' || type === 'PGK') {
        const opts = editingQ?.options || [
          { key: 'A', text: '' },
          { key: 'B', text: '' },
          { key: 'C', text: '' },
          { key: 'D', text: '' }
        ];
        const getOptText = (k) => opts.find((o) => o.key === k)?.text || '';

        if (type === 'PG') {
          const corr = editingQ?.correctAnswer || 'A';
          return `
            <div class="text-xs font-bold uppercase text-slate-600">Pilihan Jawaban (A–D) & Kunci Jawaban</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${['A', 'B', 'C', 'D']
                .map(
                  (k) => `
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Opsi ${k}</label>
                  <input id="opt_${k}" type="text" value="${getOptText(k).replace(/"/g, '&quot;')}" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm" required />
                </div>
              `
                )
                .join('')}
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Jawaban Benar</label>
              <select id="pgCorrectSelect" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-semibold">
                ${['A', 'B', 'C', 'D'].map((k) => `<option value="${k}" ${corr === k ? 'selected' : ''}>Pilihan ${k}</option>`).join('')}
              </select>
            </div>
          `;
        }

        const corrArr = Array.isArray(editingQ?.correctAnswer) ? editingQ.correctAnswer : ['A', 'B'];
        return `
          <div class="text-xs font-bold uppercase text-slate-600">Pilihan Ganda Kompleks (Pilih 2 Jawaban Benar)</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${['A', 'B', 'C', 'D']
              .map(
                (k) => `
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Opsi ${k}</label>
                <input id="opt_${k}" type="text" value="${getOptText(k).replace(/"/g, '&quot;')}" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm" required />
              </div>
            `
              )
              .join('')}
          </div>
          <div class="flex flex-wrap items-center gap-4 pt-1">
            <span class="text-xs font-semibold text-slate-700">Kunci Jawaban (Pilih 2):</span>
            ${['A', 'B', 'C', 'D']
              .map(
                (k) => `
              <label class="inline-flex items-center gap-1.5 text-sm font-medium cursor-pointer">
                <input type="checkbox" class="pgk-correct-chk rounded text-violet-600" value="${k}" ${corrArr.includes(k) ? 'checked' : ''} />
                <span>${k}</span>
              </label>
            `
              )
              .join('')}
          </div>
        `;
      }

      if (type === 'BS') {
        const corr = editingQ?.correctAnswer || 'BENAR';
        return `
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kunci Jawaban Benar / Salah</label>
            <select id="bsCorrectSelect" class="rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-sm font-semibold">
              <option value="BENAR" ${corr === 'BENAR' ? 'selected' : ''}>BENAR</option>
              <option value="SALAH" ${corr === 'SALAH' ? 'selected' : ''}>SALAH</option>
            </select>
          </div>
        `;
      }

      if (type === 'ISIAN') {
        const kwStr = Array.isArray(editingQ?.acceptedKeywords)
          ? editingQ.acceptedKeywords.join(', ')
          : '';
        return `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Kunci Jawaban Utama</label>
              <input id="isianKeyInput" type="text" value="${String(editingQ?.correctAnswer || '').replace(/"/g, '&quot;')}" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Kunci Diterima (Pisahkan dengan koma)</label>
              <input id="isianKeywordsInput" type="text" value="${kwStr.replace(/"/g, '&quot;')}" placeholder="contoh: evolusi, unilinear" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm" />
            </div>
          </div>
        `;
      }

      return `
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Ringkasan Kunci / Rubrik Jawaban Acuan</label>
          <textarea id="uraianKeyInput" rows="2" class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm" required>${editingQ?.correctAnswer || ''}</textarea>
        </div>
      `;
    }

    function bindAdminEvents() {
      // Reset to default 30 ASAS questions
      const resetBtn = document.getElementById('resetDefaultAsasBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', async () => {
          const ok = await openConfirmModal({
            title: 'Reset Bank Soal ke Default ASAS?',
            message: 'Seluruh perubahan soal akan dikembalikan ke 30 soal asli ASAS Sosiologi Kelas XII Ganjil.',
            confirmText: 'Ya, Reset Soal',
            cancelText: 'Batal',
            danger: false
          });
          if (ok) {
            state.questions = structuredClone(DEFAULT_QUESTIONS);
            state.config = structuredClone(DEFAULT_EXAM_CONFIG);
            state.admin.editingId = null;
            saveJSON(STORAGE_KEYS.QUESTIONS, state.questions);
            saveJSON(STORAGE_KEYS.CONFIG, state.config);
            renderApp();
            showToast('Bank soal berhasil direset ke 30 soal ASAS Sosiologi.', 'success');
          }
        });
      }

      // Settings form
      const cfgForm = document.getElementById('examSettingsForm');
      if (cfgForm) {
        cfgForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const titleVal = document.getElementById('cfgTitleInput').value.trim();
          const durVal = Number(document.getElementById('cfgDurationInput').value);
          const passVal = Number(document.getElementById('cfgPassingInput').value);

          if (!titleVal || durVal < 1 || passVal < 0 || passVal > 100) {
            showToast('Periksa kembali judul, durasi (menit), dan batas kelulusan (0–100).', 'warning');
            return;
          }

          state.config.title = titleVal;
          state.config.durationMinutes = durVal;
          state.config.passingGrade = passVal;
          saveJSON(STORAGE_KEYS.CONFIG, state.config);
          showToast('Pengaturan ujian berhasil disimpan.', 'success');
        });
      }

      // Add / Delete Category
      const addCatBtn = document.getElementById('addCategoryBtn');
      const newCatInput = document.getElementById('newCategoryInput');
      if (addCatBtn && newCatInput) {
        addCatBtn.addEventListener('click', () => {
          const name = newCatInput.value.trim();
          if (!name) {
            showToast('Masukkan nama kategori terlebih dahulu.', 'warning');
            return;
          }
          if (!state.config.categories.includes(name)) {
            state.config.categories.push(name);
            saveJSON(STORAGE_KEYS.CONFIG, state.config);
            renderApp();
            showToast(`Kategori "${name}" ditambahkan.`, 'success');
          }
        });
      }

      document.querySelectorAll('.del-cat-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const cIdx = Number(btn.dataset.delCat);
          if (state.config.categories.length <= 1) {
            showToast('Minimal harus ada 1 kategori ujian.', 'warning');
            return;
          }
          state.config.categories.splice(cIdx, 1);
          saveJSON(STORAGE_KEYS.CONFIG, state.config);
          renderApp();
          showToast('Kategori dihapus.', 'info');
        });
      });

      // Dynamic form type switch
      const qTypeSelect = document.getElementById('qTypeSelect');
      if (qTypeSelect) {
        qTypeSelect.addEventListener('change', (e) => {
          const dynBox = document.getElementById('adminDynamicFields');
          const editingQ = state.admin.editingId
            ? state.questions.find((item) => item.id === state.admin.editingId)
            : null;
          if (dynBox) {
            dynBox.innerHTML = renderAdminDynamicFields(e.target.value, editingQ);
            lucide.createIcons({ nodes: [dynBox] });
          }
        });
      }

      // Cancel edit
      const cancelEditBtn = document.getElementById('cancelEditQuestionBtn');
      if (cancelEditBtn) {
        cancelEditBtn.addEventListener('click', () => {
          state.admin.editingId = null;
          renderApp();
        });
      }

      // Save / Update Question
      const qForm = document.getElementById('questionForm');
      if (qForm) {
        qForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const type = document.getElementById('qTypeSelect').value;
          const category = document.getElementById('qCategorySelect').value;
          const topic = document.getElementById('qTopicInput').value.trim();
          const prompt = document.getElementById('qPromptInput').value.trim();
          const explanation = document.getElementById('qExplanationInput').value.trim();

          const typeLabelMap = {
            PG: 'Pilihan Ganda',
            PGK: 'Pilihan Ganda Kompleks (Pilih 2)',
            BS: 'Benar–Salah',
            JODOH: 'Menjodohkan',
            ISIAN: 'Isian Singkat',
            URAIAN: 'Uraian Panjang'
          };

          const baseData = {
            type,
            typeLabel: typeLabelMap[type] || type,
            category,
            topic,
            prompt,
            explanation
          };

          if (type === 'PG') {
            baseData.options = ['A', 'B', 'C', 'D'].map((k) => ({
              key: k,
              text: document.getElementById(`opt_${k}`).value.trim()
            }));
            baseData.correctAnswer = document.getElementById('pgCorrectSelect').value;
          } else if (type === 'PGK') {
            baseData.options = ['A', 'B', 'C', 'D'].map((k) => ({
              key: k,
              text: document.getElementById(`opt_${k}`).value.trim()
            }));
            const checkedKeys = Array.from(document.querySelectorAll('.pgk-correct-chk:checked')).map((c) => c.value);
            if (checkedKeys.length !== 2) {
              showToast('Pilih tepat 2 kunci jawaban untuk soal Pilihan Ganda Kompleks.', 'warning');
              return;
            }
            baseData.selectCount = 2;
            baseData.correctAnswer = checkedKeys;
          } else if (type === 'BS') {
            baseData.options = [
              { key: 'BENAR', text: 'BENAR' },
              { key: 'SALAH', text: 'SALAH' }
            ];
            baseData.correctAnswer = document.getElementById('bsCorrectSelect').value;
          } else if (type === 'ISIAN') {
            const mainKey = document.getElementById('isianKeyInput').value.trim();
            const rawKw = document.getElementById('isianKeywordsInput').value.trim();
            const kwList = rawKw
              ? rawKw.split(',').map((s) => s.trim()).filter(Boolean)
              : [mainKey.toLowerCase()];
            baseData.correctAnswer = mainKey;
            baseData.acceptedKeywords = kwList;
          } else if (type === 'URAIAN') {
            baseData.correctAnswer = document.getElementById('uraianKeyInput').value.trim();
          }

          if (state.admin.editingId) {
            state.questions = state.questions.map((item) =>
              item.id === state.admin.editingId ? { ...item, ...baseData } : item
            );
            state.admin.editingId = null;
            showToast('Soal berhasil diperbarui.', 'success');
          } else {
            const nextNum = state.questions.length + 1;
            const newQ = {
              id: Date.now(),
              number: nextNum,
              section: `Bagian Tambahan • ${baseData.typeLabel}`,
              ...baseData
            };
            state.questions.push(newQ);
            showToast(`Soal baru (#${nextNum}) berhasil ditambahkan ke bank soal.`, 'success');
          }

          saveJSON(STORAGE_KEYS.QUESTIONS, state.questions);
          renderApp();
        });
      }

      // Edit & Delete question actions
      document.querySelectorAll('.edit-q-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.admin.editingId = Number(btn.dataset.editId);
          renderApp();
          document.getElementById('questionEditorSection')?.scrollIntoView({ behavior: 'smooth' });
        });
      });

      document.querySelectorAll('.del-q-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const qId = Number(btn.dataset.delId);
          const ok = await openConfirmModal({
            title: 'Hapus Soal dari Bank Soal?',
            message: 'Soal yang dihapus tidak akan muncul pada sesi ujian berikutnya (kecuali di-reset ke default).',
            confirmText: 'Ya, Hapus Soal',
            cancelText: 'Batal',
            danger: true
          });
          if (ok) {
            state.questions = state.questions.filter((item) => item.id !== qId);
            if (state.admin.editingId === qId) state.admin.editingId = null;
            saveJSON(STORAGE_KEYS.QUESTIONS, state.questions);
            renderApp();
            showToast('Soal berhasil dihapus.', 'info');
          }
        });
      });

      // Filter & Search in Admin bank
      const filterSel = document.getElementById('adminFilterType');
      const searchInp = document.getElementById('adminSearchInput');
      if (filterSel) {
        filterSel.addEventListener('change', (e) => {
          state.admin.filterType = e.target.value;
          renderApp();
        });
      }
      if (searchInp) {
        searchInp.addEventListener('input', (e) => {
          state.admin.searchQuery = e.target.value;
          renderApp();
          const refocused = document.getElementById('adminSearchInput');
          if (refocused) {
            refocused.focus();
            refocused.setSelectionRange(refocused.value.length, refocused.value.length);
          }
        });
      }
    }

    // =========================================================================
    // 8. INITIALIZATION
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Navigation click handlers
      document.querySelectorAll('[data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const drawer = document.getElementById('mobileNavDrawer');
          if (drawer) drawer.classList.add('hidden');
          navigateTo(btn.dataset.nav);
        });
      });

      const logoBtn = document.getElementById('brandLogoBtn');
      if (logoBtn) {
        logoBtn.addEventListener('click', () => navigateTo('home'));
      }

      const mobileBtn = document.getElementById('mobileMenuBtn');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          const drawer = document.getElementById('mobileNavDrawer');
          if (drawer) drawer.classList.toggle('hidden');
        });
      }

      updateNavActiveStyles();
      renderApp();
    });
  </script>
</body>
</html>
